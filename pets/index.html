<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visit the pets · Abby + David</title>
  <meta name="description" content="A tiny pixel pet toy starring Jack, Albert, Elda and Shetland.">
  <link rel="canonical" href="https://abbydavid.com/pets/">
  <meta name="theme-color" content="#f6f1e7">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Abby + David">
  <meta property="og:title" content="Visit the pets · Abby + David">
  <meta property="og:description" content="A tiny pixel pet toy starring Jack, Albert, Elda and Shetland.">
  <meta property="og:url" content="https://abbydavid.com/pets/">
  <meta property="og:image" content="https://abbydavid.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="/" aria-label="Abby + David, home">ABBY <span>+</span> DAVID</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="/#projects">Projects</a></li>
          <li><a href="/pets/" aria-current="page">Pets</a></li>
          <li><a href="/#about">About</a></li>
          <li><a class="ext" href="https://github.com/revDWD">GitHub ↗</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap pets-page">
      <h1>Visit the pets</h1>
      <p class="lede mono">Nothing here can go wrong. Take your time.</p>

      <noscript>
        <p>This little toy needs JavaScript. Meanwhile: Jack (Chihuahua), Albert (cat), Elda (cat) and Shetland (cat) say hi.</p>
      </noscript>

      <div id="app" hidden>
        <div class="picker" id="picker" role="group" aria-label="Choose a pet"></div>

        <section class="room" aria-label="Pet room">
          <p class="stamp" id="stamp" hidden>★ Whole crew</p>
          <div class="room-head mono">
            <span id="kind"></span>
            <span class="hearts" id="hearts" role="img" aria-label=""></span>
          </div>
          <div class="stage" id="stage">
            <svg class="toy" id="toy" viewBox="0 0 6 6" shape-rendering="crispEdges" hidden aria-hidden="true"><path fill="#a94a2f" d="M2 0h2v1h-2zM1 1h4v1h-4zM0 2h6v2h-6zM1 4h4v1h-4zM2 5h2v1h-2z"/><path fill="#232321" d="M1 2h1v1h-1zM2 3h2v1h-2zM4 1h1v1h-1z"/></svg>
            <svg class="bowl" id="bowl" viewBox="0 0 8 3" shape-rendering="crispEdges" hidden aria-hidden="true"><path fill="#a94a2f" d="M0 0h8v1h-8z"/><path fill="#232321" d="M1 1h6v1h-6zM2 2h4v1h-4z"/></svg>
            <span class="sprite cat" id="sprite" aria-hidden="true"></span>
            <div class="fx" id="fx" aria-hidden="true"></div>
          </div>
          <img class="photo" id="photo" hidden alt="">
          <p class="say" id="say" role="status" aria-live="polite"></p>
          <div class="actions">
            <button type="button" data-act="feed">Feed</button>
            <button type="button" data-act="pet">Pet</button>
            <button type="button" data-act="play">Play</button>
          </div>
          <p class="found" id="found" hidden></p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer mono">
    <div class="wrap">
      <p>Abby + David · St. Louis, Missouri</p>
      <p><a href="/">← Home</a></p>
    </div>
  </footer>

  <script src="/pets/pets.js"></script>
</body>
</html>
